<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17202a;font:16px Arial;color:#fff}.calculator{width:min(92vw,320px);padding:18px;background:#263545;border-radius:14px;box-shadow:0 8px 25px #0006}input{width:100%;height:65px;margin-bottom:12px;padding:10px;border:0;border-radius:8px;background:#101820;color:#fff;text-align:right;font-size:30px}section{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{height:55px;border:0;border-radius:8px;background:#3d5063;color:#fff;font-size:20px;cursor:pointer}button:hover{background:#526b80}.operator{background:#e67e22}.equal{background:#27ae60;grid-column:span 2}.clear{background:#c0392b}
</style>
</head>
<body>
<main class="calculator">
<input id="display" value="" placeholder="0" readonly aria-label="Calculator display">
<section>
<button class="clear" data-key="C">C</button><button data-key="/">/</button><button data-key="*">*</button><button data-key="Backspace">&#9003;</button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="operator" data-key="-">-</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="+">+</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key=".">.</button>
<button data-key="0">0</button><button class="equal" data-key="Enter">=</button>
</section>
</main>
<script>
const display=document.getElementById('display');
function calculate(key){if(key==='C')display.value='';
else if(key==='Backspace')display.value=display.value.slice(0,-1);
else if(key==='Enter'){try{display.value=Function(`return ${display.value}`)()}catch{display.value='Error'}}else if(/[0-9.+*/-]/.test(key))display.value+=key}
document.querySelectorAll('button').forEach(button=>button.onclick=()=>calculate(button.dataset.key));
document.onkeydown=event=>calculate(event.key);
</script>
</body>
</html>
